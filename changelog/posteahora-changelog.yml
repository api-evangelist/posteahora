- breaking: false
  highlights:
  - Pick WordPress categories and tags by name
  - The WordPress options in the composer now list your site's categories and tags, so you choose them by name instead of typing numeric IDs.
  date: '2026-09-24'
- breaking: false
  highlights:
  - Clearer reasons when a Facebook post fails
  - When Facebook rejects a post, you now see what went wrong and how to fix it, instead of a raw error code from Facebook.
  date: '2026-09-24'
- breaking: false
  highlights:
  - YouTube videos scheduled through the API or MCP now keep their title
  - A YouTube video created through the API or an AI assistant (MCP) could be accepted and then fail at publish because its title never reached
    YouTube. The post title is now used as the video title.
  date: '2026-09-24'
- breaking: false
  highlights:
  - LinkedIn posts no longer get cut off
  - LinkedIn captions containing brackets, parentheses or other special characters were published only up to that character. The full caption
    now goes out intact.
  date: '2026-09-22'
- breaking: false
  highlights:
  - 'ChatGPT: a step-by-step guide with screenshots'
  - Connecting ChatGPT to PosteAhora now has a walkthrough in the docs — eight steps, one screenshot each, checked by us on a real account — and
    the ChatGPT page inside the app links straight to it.
  date: '2026-09-15'
- breaking: false
  highlights:
  - 'Small fixes: blank pages, breached passwords, the phone menu'
  - If the app fails to load you now get a message and a Reload button instead of a blank page; a password that has appeared in a data breach
    is named as such at sign-up instead of "too short"; and the "All sections" menu on phones scrolls all the way to Sign out.
  date: '2026-09-14'
- breaking: false
  highlights:
